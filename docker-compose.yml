services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskly
      POSTGRES_USER: taskly
      POSTGRES_PASSWORD: taskly
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskly"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://taskly:taskly@db:5432/taskly
      JWT_SECRET: change-me-in-production
      JWT_REFRESH_SECRET: change-me-in-production-refresh
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
